<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPWS — Cockpit</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #14171c; --panel2: #1a1e24; --line: #262b33;
    --ink: #e8eaed; --dim: #8a919c; --accent: #5b9dff;
    --ok: #34c98e; --ko: #f2724b; --warn: #e6b451;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; height: 100vh; display: flex; overflow: hidden; }

  /* ——— sidebar ——— */
  aside { width: 280px; min-width: 280px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  aside h1 { font-size: 15px; padding: 14px 16px 4px; letter-spacing: .3px; }
  aside h1 span { color: var(--dim); font-weight: 400; }
  aside .sub { padding: 0 16px 10px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
  #list { overflow-y: auto; flex: 1; padding: 8px; }
  .item { padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 9px; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: var(--panel2); outline: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .item .name { flex: 1; min-width: 0; }
  .item .name b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .name small { color: var(--dim); font-size: 11px; }
  .item .pct { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .new { font-size: 9px; background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 4px; }

  /* ——— zone principale ——— */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header .src { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }
  header a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.ko { background: color-mix(in srgb, var(--ko) 18%, transparent); color: var(--ko); }
  .badge.na { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .spacer { flex: 1; }

  nav.tabs, .devices { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .tabs button, .devices button { background: none; border: 0; color: var(--dim); font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 6px; cursor: pointer; }
  .tabs button.on, .devices button.on { background: var(--panel2); color: var(--ink); }

  #stage { flex: 1; min-height: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .cols { flex: 1; min-height: 0; display: flex; gap: 10px; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .col .cap { padding: 6px 10px; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--line); }
  .scroll { flex: 1; overflow: auto; background: #fff; }
  .scroll img { display: block; width: 100%; }
  iframe { flex: 1; border: 0; background: #fff; }

  /* glissière avant/après */
  .wipe-wrap { position: relative; }
  .wipe-wrap img { display: block; width: 100%; }
  .wipe-wrap img.top { position: absolute; inset: 0; }
  .wipe-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
  .wipe-ui { display: flex; align-items: center; gap: 10px; padding: 4px 2px; color: var(--dim); font-size: 11px; }
  .wipe-ui input { flex: 1; accent-color: var(--accent); }

  .empty { margin: auto; text-align: center; color: var(--dim); max-width: 46ch; }
  .empty b { color: var(--ink); }
  .notes { font-size: 11px; color: var(--dim); }
  .notes li { margin-left: 16px; }

  /* ——— variantes ——— */
  .vbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .vbar button { background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 7px; cursor: pointer; }
  .vbar button.on { background: var(--panel2); color: var(--ink); border-color: var(--accent); }
  .hypo { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; display: grid; gap: 6px; font-size: 12px; }
  .hypo .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hypo .h { color: var(--ink); font-size: 13px; }
  .hypo .k { color: var(--dim); }
  .hypo .k b { color: var(--ink); font-weight: 600; }
  .prio { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px; }
  .prio.HIGH { background: color-mix(in srgb, var(--ko) 20%, transparent); color: var(--ko); }
  .prio.MEDIUM { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .prio.LOW { background: color-mix(in srgb, var(--dim) 20%, transparent); color: var(--dim); }

  /* ——— journal des changements ——— */
  .jrn { border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    max-height: 32vh; overflow-y: auto; }
  .jrn .hd { padding: 7px 12px; font-size: 11px; color: var(--dim);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .jr { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12px; }
  .jr:last-child { border-bottom: 0; }
  .jr:hover { background: var(--panel2); }
  .verbe { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    padding: 2px 0; text-align: center; border-radius: 5px; height: fit-content; }
  .verbe.set { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .verbe.remove { background: color-mix(in srgb, var(--ko) 20%, transparent); color: var(--ko); }
  .verbe.duplicate { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .verbe.move, .verbe.swap { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .jr .av { color: var(--dim); text-decoration: line-through; }
  .jr .ap { color: var(--ink); }
  .jr .po { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .jr .lieu { color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<aside>
  <h1>LPWS <span>· cockpit</span></h1>
  <div class="sub">captures & variantes — se met à jour seul</div>
  <div id="list"></div>
</aside>
<main>
  <header id="head" hidden>
    <span id="verdict" class="badge"></span>
    <span class="src" id="src"></span>
    <a id="openLive" target="_blank">live ↗</a>
    <a id="openClone" target="_blank">clone ↗</a>
    <span class="spacer"></span>
    <nav class="devices" id="devices">
      <button data-d="" class="on">Desktop</button>
      <button data-d=".mobile">Mobile</button>
    </nav>
    <nav class="tabs" id="tabs">
      <button data-t="side" class="on">Côte à côte</button>
      <button data-t="wipe">Glissière</button>
      <button data-t="diff">Diff</button>
      <button data-t="render">Clone rendu</button>
      <button data-t="variants">Variantes</button>
    </nav>
  </header>
  <div id="stage">
    <div class="empty"><b>Aucune capture sélectionnée.</b><br>
      Lance <code>npm run clone -- &lt;url&gt;</code> dans un terminal : la capture apparaîtra ici toute seule.</div>
  </div>
</main>

<script>
  let items = [], sel = null, tab = "side", device = "", known = new Set(), first = true
  let selVariant = null
  const vcache = {}   // "<campagne>/<variante>" → variant.json (évite de refetch à chaque rendu)

  const $ = (s) => document.querySelector(s)
  const pct = (x) => (x * 100).toFixed(1) + "%"
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
  const F = (p) => `/files/${sel.path}/baseline/${p}`

  /* ——— sidebar ——— */
  /** "https://www.atlassian.com/software/jira" → "Atlassian" — on identifie une capture par
   *  la MARQUE du client, pas par le slug d'URL ni par le dossier de rangement. */
  function marque(it) {
    if (!it.source) return it.client
    try {
      const h = new URL(it.source).hostname.replace(/^www\./, "")
      const n = h.split(".")[0]
      return n.charAt(0).toUpperCase() + n.slice(1)
    } catch { return it.client }
  }

  function renderList() {
    $("#list").innerHTML = items.map((it) => {
      const color = !it.judged ? "var(--warn)" : it.fidele ? "var(--ok)" : "var(--ko)"
      const isNew = !first && !known.has(it.path)
      const nv = it.variants.length
      return `<div class="item ${sel?.path === it.path ? "sel" : ""}" data-p="${it.path}">
        <span class="dot" style="background:${color}"></span>
        <span class="name"><b>${marque(it)}</b><small>${it.campaign}${
          nv ? ` · ${nv} variante${nv > 1 ? "s" : ""}` : ""}</small></span>
        ${isNew ? '<span class="new">nouveau</span>' : ""}
        <span class="pct">${it.judged ? pct(it.diff.desktop) : "—"}</span>
      </div>`
    }).join("")
    document.querySelectorAll(".item").forEach((el) =>
      el.onclick = () => { sel = items.find((i) => i.path === el.dataset.p); renderStage() })
  }

  /* ——— vues ——— */
  const col = (cap, inner) => `<div class="col"><div class="cap">${cap}</div>${inner}</div>`
  const scrollImg = (src, id) => `<div class="scroll" id="${id}"><img src="${src}"></div>`

  function renderStage() {
    renderList()
    const st = $("#stage")
    if (!sel) return
    $("#head").hidden = false
    const v = $("#verdict")
    v.className = "badge " + (!sel.judged ? "na" : sel.fidele ? "ok" : "ko")
    v.textContent = !sel.judged ? "non jugée" : sel.fidele ? "fidèle" : "pas fidèle"
    $("#src").textContent = sel.source ?? sel.path
    $("#openLive").href = sel.source ?? "#"
    $("#openClone").href = F("capture.html")

    const orig = F(`original${device}.png`), clone = F(`clone${device}.png`), diff = F(`diff${device}.png`)
    const ratios = sel.judged ? ` — diff desktop ${pct(sel.diff.desktop)} · mobile ${pct(sel.diff.mobile)}` : ""

    if (tab === "side") {
      st.innerHTML = `<div class="cols">
        ${col("VRAI SITE (au moment de la capture)", scrollImg(orig, "sA"))}
        ${col("CLONE" + ratios, scrollImg(clone, "sB"))}
      </div>`
      syncScroll($("#sA"), $("#sB"))
    } else if (tab === "wipe") {
      st.innerHTML = `
        <div class="wipe-ui">vrai site <input type="range" id="wr" min="0" max="100" value="50"> clone</div>
        <div class="cols">${col("GLISSIÈRE — gauche : vrai site · droite : clone",
          `<div class="scroll"><div class="wipe-wrap" id="ww">
             <img src="${orig}"><img class="top" src="${clone}" id="wt">
             <div class="wipe-line" id="wl"></div></div></div>`)}</div>`
      const upd = (p) => { $("#wt").style.clipPath = `inset(0 0 0 ${p}%)`; $("#wl").style.left = p + "%" }
      $("#wr").oninput = (e) => upd(e.target.value); upd(50)
    } else if (tab === "diff") {
      st.innerHTML = `<div class="cols">${col("DIFF — en rouge, les pixels qui diffèrent" + ratios, scrollImg(diff, "sD"))}</div>`
    } else if (tab === "render") {
      st.innerHTML = `<div class="cols">${col(
        "CLONE RENDU EN VRAI (pas un screenshot) — les fonts/assets chargent encore depuis le site source",
        `<iframe src="${F("capture.html")}"></iframe>`)}</div>`
    } else if (tab === "variants") {
      renderVariants(st)
    }
  }

  /* ——— onglet variantes : l'hypothèse, puis baseline / variante / delta synchronisés ——— */
  function renderVariants(st) {
    if (!sel.variants.length) {
      st.innerHTML = `<div class="empty"><b>Aucune variante pour cette campagne.</b><br>
        La mécanique existe (<code>npm run apply -- &lt;baseline&gt; &lt;spec.json&gt;</code>) mais le
        moteur de diagnostic qui écrit les specs n'est pas encore construit.</div>`
      return
    }
    if (!sel.variants.includes(selVariant)) selVariant = sel.variants[0]
    const key = sel.path + "/" + selVariant
    const bar = `<div class="vbar">${sel.variants.map((v) =>
      `<button data-v="${v}" class="${v === selVariant ? "on" : ""}">${v}</button>`).join("")}</div>`

    const V = (p) => `/files/${sel.path}/variants/${selVariant}/${p}`
    const charge = key in vcache          // distinguer « pas encore lu » de « illisible »
    const d = vcache[key]
    const dd = d?.deltas?.[device === ".mobile" ? "mobile" : "desktop"]
    const card = !d ? `<div class="hypo k">${charge
      ? "variant.json illisible — la variante s'affiche quand même, sans son hypothèse."
      : "lecture de variant.json…"}</div>` : `
      <div class="hypo">
        <div class="top">
          <span class="prio ${d.diagnostic.priorite}">${d.diagnostic.priorite}</span>
          <span class="h">${esc(d.hypothese)}</span>
        </div>
        <div class="k"><b>Signal —</b> ${esc(d.diagnostic.signal)}</div>
        <div class="k"><b>Métrique visée —</b> ${esc(d.metrique)} &nbsp;·&nbsp;
          <b>Risque —</b> ${esc(d.risque)}</div>
        <div class="k"><b>Règle —</b> ${esc(d.diagnostic.regle)} &nbsp;·&nbsp;
          <b>Confiance —</b> ${esc(d.diagnostic.confiance)} &nbsp;·&nbsp;
          <b>Preuve —</b> ${esc(d.diagnostic.preuve)}</div>
      </div>`

    // le journal : ce que la mécanique a RÉELLEMENT changé, dans l'ordre, avec sa position
    const j = d?.journal ?? []
    const flecheOuBloc = (r) => r.op === "set"
      ? `<span class="av">${esc(r.avant || "(vide)")}</span> → <span class="ap">${esc(r.apres)}</span>`
      : r.op === "remove" ? `<span class="av">${esc(r.avant)}</span>`
      : r.op === "swap" ? `<span class="ap">${esc(r.avant)}</span> ↔ <span class="ap">${esc(r.apres)}</span>`
      : `<span class="ap">${esc(r.quoi)}</span> <span class="lieu">→ ${esc(r.ou ?? "")}</span>`
    const jrn = !j.length ? "" : `<div class="jrn">
      <div class="hd">CE QUI A CHANGÉ — ${j.length} modification${j.length > 1 ? "s" : ""} ·
        clique une ligne pour t'y rendre dans la page</div>
      ${j.map((r) => `<div class="jr" data-y="${r.y ?? 0}">
        <span class="verbe ${r.op}">${r.op}</span>
        <span>
          <div>${flecheOuBloc(r)}</div>
          <div class="po">${esc(r.pourquoi)}</div>
          <div class="lieu">${r.section ? "section " + r.section + " · " : ""}${
            r.y != null ? "à " + r.y + " px du haut" : ""} · ancre ${r.anchor}</div>
        </span>
      </div>`).join("")}</div>`

    st.innerHTML = bar + card + jrn + `<div class="cols">
      ${col("BASELINE (le clone du client)", scrollImg(F(`clone${device}.png`), "vA"))}
      ${col("VARIANTE — " + selVariant, scrollImg(V(`variant${device}.png`), "vB"))}
    </div>`
    syncScroll($("#vA"), $("#vB"))

    // aller à l'endroit exact d'un changement : les captures sont pleine page, donc la
    // position en pixels de page se convertit par le facteur d'affichage de l'image
    st.querySelectorAll(".jr").forEach((row) => row.onclick = () => {
      const box = $("#vB"), img = box?.querySelector("img")
      if (!img?.naturalWidth) return
      box.scrollTop = Number(row.dataset.y) * (img.clientWidth / img.naturalWidth) - 120
    })
    st.querySelector(".vbar").onclick = (e) => {
      if (!e.target.dataset.v) return
      selVariant = e.target.dataset.v; renderStage()
    }
    if (!charge) fetch(V("variant.json")).then((r) => r.json())
      .then((j) => { vcache[key] = j; if (tab === "variants") renderStage() })
      .catch(() => { vcache[key] = null })
  }

  function syncScroll(a, b) {
    if (!a || !b) return
    let lock = false
    const link = (x, y) => x.addEventListener("scroll", () => {
      if (lock) return; lock = true
      y.scrollTop = x.scrollTop / (x.scrollHeight - x.clientHeight || 1) * (y.scrollHeight - y.clientHeight)
      requestAnimationFrame(() => (lock = false))
    })
    link(a, b); link(b, a)
  }

  /* ——— tabs & device ——— */
  $("#tabs").onclick = (e) => { if (!e.target.dataset.t) return
    tab = e.target.dataset.t
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b === e.target))
    renderStage() }
  $("#devices").onclick = (e) => { if (e.target.dataset.d === undefined) return
    device = e.target.dataset.d
    document.querySelectorAll("#devices button").forEach((b) => b.classList.toggle("on", b === e.target))
    renderStage() }

  /* ——— poll : les nouvelles captures apparaissent seules ——— */
  async function refresh() {
    try {
      const next = await (await fetch("/api/baselines")).json()
      if (JSON.stringify(next) !== JSON.stringify(items)) {
        items = next
        if (sel) sel = items.find((i) => i.path === sel.path) ?? null
        renderList()
        if (sel) renderStage()
      }
      if (first || items.some((i) => !known.has(i.path))) {
        setTimeout(() => { items.forEach((i) => known.add(i.path)); renderList() }, 6000)
      }
      first = false
    } catch { /* serveur redémarré : on retentera */ }
  }
  refresh(); setInterval(refresh, 4000)
</script>
</body>
</html>
